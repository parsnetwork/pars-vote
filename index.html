<!doctype html>
<!-- The engine theme and the CSS token layer are separate switches: the
     provider picks the engine's dark row, this class is what makes the custom
     properties resolve to their dark values. Setting one without the other
     gives a dark page with light hairlines. -->
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The tenant's name is added by main.tsx. This file is served to a
         preview URL and a bare address as well as to pars.vote, and naming the
         site here would put it in the tab of a host that is not it. -->
    <title>Vote</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
